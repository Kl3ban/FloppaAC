# ============================================================
#  FloppaAC 1.8.0 - konfiguracja
#  VL = violation level. Kazdy check zbiera VL, ktore spada
#  z czasem (decay). Kara dopiero po przekroczeniu progu.
#  TRYB TESTOWY: kicki zamiast banow (ban-vl = 999999).
#  Stabilny CPS 8-12 NIE flaguje. Flaga tylko przy nieludzkich
#  wartosciach (20+ CPS, metronom ponizej 2 ms, serie <40 ms).
# ============================================================

prefix: "&8[&bFloppaAC&8]"

# Co ile sekund VL gracza spada o 1 (0 = wylacz decay)
vl-decay-seconds: 30

# Ponizej tego TPS kontrole movement sa wstrzymane
min-tps: 18.5

# Gracze z pingiem powyzej tego dostaja luzniejsze progi
high-ping: 220
high-ping-leniency: 0.35

alerts:
  format: "&8[&bFloppaAC&8] &c%player% &7nie przeszedl &b%check% &8(VL: &c%vl%&8) &7ping: &e%ping% &7tps: &e%tps%"
  hover-details: true
  # Kopia kazdej flagi BEZPOSREDNIO do testowanego gracza
  send-to-cheater: true
  cheater-format: "&8[&bFloppaAC&8] &eWykryto: &b%check% &8(VL: &c%vl%&8) &7ping: &e%ping% &7tps: &e%tps%"
  # Podejrzenia ponizej progu flagi (tryb verbose)
  verbose-enabled: true

punishments:
  # Movement: najpierw cofniecie na legalny grunt, potem kick
  movement-setback-vl: 2
  movement-kick-vl: 12
  movement-ban-vl: 999999
  # FakeLag: wlasny niski prog kicka, bo psuje gre innym od razu
  fakelag-kick-vl: 6
  # Combat: szybciej, bo psuje gre innym
  combat-kick-vl: 8
  combat-ban-vl: 999999
  # Player: scaffold, nuker, badpackets
  player-kick-vl: 10
  player-ban-vl: 999999
  kick-command: "kick %player% FloppaAC: wykryto cheat (%check%)"
  ban-command: "ban %player% FloppaAC: cheat (%check%)"

# Bezpiecznik lacza: kick przy skrajnie niestabilnym ruchu
lagguard:
  kick-command: "kick %player% FloppaAC: niestabilne polaczenie (lag)"

